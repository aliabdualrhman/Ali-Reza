org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# السماح بمسار المشروع الذي يحتوي أحرفاً غير ASCII (مثل الاسم العربي للمجلد).
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# إضافة زنبور: إسكات تحذير AGP بأن أقصى منصة موصى بها هي 36.
# نبني على 37 عن قصد لأن بعض حزمنا تتطلبها، والتحذير بلا أثر عملي.
android.suppressUnsupportedCompileSdk=37

# Windows: مشروع على D: وPub Cache على C: — تعطيل incremental يمنع خطأ "different roots".
kotlin.incremental=false
kotlin.incremental.android=false
